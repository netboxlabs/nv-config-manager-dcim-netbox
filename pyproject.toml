[project]
name = "nv-config-manager-dcim-netbox"
version = "0.1.0"
description = "NetBox implementation of the NVIDIA Config Manager DCIM provider API"
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
license-files = ["LICENSE"]
# The floor is set by NVCM's SDK (nv-config-manager-dcim), which requires 3.13:
# this package runs inside NVCM's application pods, not NetBox's. The NetBox
# plugin (netbox-nv-config-manager) follows NetBox's own floor instead, so the
# two differ on purpose.
requires-python = ">=3.13"
authors = [
    { name = "NetBox Labs", email = "support@netboxlabs.com" },
]
maintainers = [
    { name = "NetBox Labs", email = "support@netboxlabs.com" },
]
keywords = ["netbox", "nvidia", "nv-config-manager", "dcim"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp[speedups]>=3.14.1",
    "netaddr",
    "nv-config-manager-dcim",
]

# Deployment tooling only. Kept out of the base dependencies because this wheel
# is installed into NVCM's application pods through the offline provider
# wheelhouse, which should not carry click/PyYAML.
[project.optional-dependencies]
installer = [
    "click>=8.1.7",
    "nv-config-manager-installer",
    "pyyaml>=6.0.2",
]
# DSX Air simulations. `nv-config-manager-installer` is not published, and a
# checkout of nv-config-manager is required anyway (its Helm chart and the
# topology blueprints live there), so `make setup` installs it from that checkout
# rather than pinning a git ref that a force-push can orphan.
# Listed here by bare name for the same reason nv-config-manager-dcim is.
air = [
    "click>=8.1.7",
    "nv-config-manager-installer",
    "pyyaml>=6.0.2",
]

[project.scripts]
nvcm-netbox = "nv_config_manager_dcim_netbox.installer.cli:main"

[project.urls]
Homepage = "https://github.com/netboxlabs/nv-config-manager-dcim-netbox"
Source = "https://github.com/netboxlabs/nv-config-manager-dcim-netbox"
Issues = "https://github.com/netboxlabs/nv-config-manager-dcim-netbox/issues"
Changelog = "https://github.com/netboxlabs/nv-config-manager-dcim-netbox/blob/main/CHANGELOG.md"

# Discovered by the SDK through the `nv_config_manager.dcim` entry-point group.
# The entry-point name and DCIMProviderMetadata.name must both be "netbox".
[project.entry-points."nv_config_manager.dcim"]
netbox = "nv_config_manager_dcim_netbox:NetBoxProvider"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.15.11",
]

# The SDK is not yet published to an index. Install it directly from the Git
# repository without a checkout (pin a tag or commit instead of main when
# reproducibility is required):
#   uv pip install \
#     "nv-config-manager-dcim @ git+https://github.com/dsx-ai-factory/nv-config-manager.git@main#subdirectory=packages/dcim" \
#     -e .
#
# When developing both repositories, use an editable sibling checkout instead:
#
# [tool.uv.sources]
# nv-config-manager-dcim = { path = "../nv-config-manager/packages/dcim", editable = true }

[build-system]
# 1.27 is the first release that accepts a PEP 639 SPDX `license` string.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nv_config_manager_dcim_netbox"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "inventory: core inventory / DCIM operations",
    "reference: reference / selection lists",
    "ipam: IPAM / VRF operations",
    "hosts: host / MAC correlation",
    "dhcp: DHCP operations",
    "ztp: ZTP operations",
    "firmware: firmware / OS-image operations",
    "state: NVCM lifecycle state (managed / intended / backup)",
    "secrets: secret / password operations",
    "render: render data assembly",
    "spectrumx: Spectrum-X overlay operations",
    "ib: InfiniBand operations",
    "lifecycle: provider factory / lifecycle",
    "events: change-event integration",
    "installer: deployment orchestration (nvcm-netbox)",
    "air: DSX Air simulation path (needs the `air` extra)",
    "live: runs against a real NetBox (NVCM_LIVE_SERVER/TOKEN; scripts/live-netbox.sh)",
]
