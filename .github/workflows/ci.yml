name: CI

on:
  pull_request: {}
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      # Both halves of `make lint`, so formatting drift cannot land on main and
      # then surface as an unrelated diff in someone else's PR.
      - name: Ruff
        run: uvx ruff@0.15.11 check src/ tests/
      - name: Ruff format
        run: uvx ruff@0.15.11 format --check src/ tests/

  # NETBOX_VERSION is what `make version-check` compares against the plugin's
  # min_version, so it drifting from the base image makes that check assert the
  # wrong thing.
  netbox-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Base image tag matches the version we record
        run: |
          set -euo pipefail
          . build/versions.env
          tag="${NETBOX_BASE_IMAGE##*:}"
          echo "NETBOX_BASE_IMAGE=${NETBOX_BASE_IMAGE}"
          # netbox-docker tags a NetBox release as `vX.Y.Z`, so the tag carries
          # the version PluginConfig.validate() will see at runtime.
          if [ "${tag}" != "v${NETBOX_VERSION}" ]; then
            echo "::error::NETBOX_BASE_IMAGE is tagged ${tag}, but build/versions.env" \
                 "records NETBOX_VERSION=${NETBOX_VERSION}."
            exit 1
          fi
          # A pre-release tag would satisfy min_version -- validate() compares
          # RELEASE.version, and a beta reports a plain 4.7.0 -- while differing
          # from the release in ways the plugin depends on. Reject it here.
          case "${tag}" in
            *-alpha*|*-beta*|*-rc*)
              echo "::error::NETBOX_BASE_IMAGE ${tag} is a pre-release; pin a released tag."
              exit 1
              ;;
          esac
      - name: Base image tag exists upstream
        run: |
          set -euo pipefail
          . build/versions.env
          repo="${NETBOX_BASE_IMAGE%:*}"; repo="${repo#ghcr.io/}"
          tag="${NETBOX_BASE_IMAGE##*:}"
          token=$(curl -fsSL \
            "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" \
            | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          curl -fsSL -o /dev/null \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/${repo}/manifests/${tag}"

  # NVCM installs the provider by copying /plugin-wheels out of this image and
  # running `pip install --no-index --find-links` in an init container. Nothing
  # on that path fails loudly, so assert the contract here.
  provider-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch DCIM SDK
        run: |
          git clone --depth 1 \
            https://github.com/dsx-ai-factory/nv-config-manager.git ../nv-config-manager
      - name: Build
        run: |
          docker build --platform linux/amd64 \
            --build-context sdk=../nv-config-manager/packages/dcim \
            -t nv-config-manager-dcim-netbox:ci .
      - name: Offline /plugin-wheels contract
        run: build/check-provider-image.sh nv-config-manager-dcim-netbox:ci linux/amd64

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      # The SDK is not yet published. Until then, install it from the NVCM
      # branch that defines the provider contract. Update this once published.
      - name: Fetch DCIM SDK
        run: |
          git clone --depth 1 \
            https://github.com/dsx-ai-factory/nv-config-manager.git ../nv-config-manager
      # Into a venv, not `--system`: the interpreter setup-uv provisions is
      # uv-managed and externally managed, so `uv pip install --system` errors.
      # `--clear` because setup-uv already creates (and exports) a .venv itself;
      # without it `uv venv` aborts on the existing directory.
      - name: Install
        run: |
          uv venv --clear --python 3.13
          # One resolution, mirroring `make setup`. The `installer` extra needs
          # nv-config-manager-installer, which is unpublished, so its checkout
          # path has to be in the same command -- resolving the extra on its own
          # sends uv to the registry, where the package does not exist.
          #
          # That extra is needed just to *collect* the suite: test_installer.py
          # and test_air.py import click and PyYAML at module scope. The `air`
          # extra is not installed; those imports are guarded with importorskip.
          uv pip install \
            ../nv-config-manager/packages/dcim \
            -e ../nv-config-manager/installer \
            -e '.[installer]' \
            pytest pytest-asyncio
      - name: Tests
        run: .venv/bin/pytest

  # The provider against a real NetBox, which is the only place upstream schema
  # drift shows up: the fixture suites cannot see a renamed GraphQL field or a
  # changed custom-field shape. The 4.7 upgrade produced two such breaks.
  #
  # Needs the plugin, which lives in a private sibling repo, so this job is
  # skipped unless PLUGIN_REPO_TOKEN is set (a token with read access to
  # netboxlabs/netbox-nv-config-manager). GITHUB_TOKEN is scoped to this repo and
  # cannot check it out.
  # Gate as its own job so that without the token live-netbox is *skipped*, which
  # is visibly different from a green run. Gating inside the job left every step
  # skipped under a successful conclusion, indistinguishable from a suite that ran.
  live-gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - id: gate
        run: |
          if [ -n "${{ secrets.PLUGIN_REPO_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PLUGIN_REPO_TOKEN not set; the live NetBox suite will be skipped, not run."
          fi

  live-netbox:
    needs: live-gate
    if: needs.live-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
          POSTGRES_DB: netbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          repository: netboxlabs/netbox-nv-config-manager
          token: ${{ secrets.PLUGIN_REPO_TOKEN }}
          # actions/checkout refuses a path outside the workspace.
          path: _plugin

      # SDK and the topology blueprint both come from here.
      - name: Fetch NVCM
        run: |
          git clone --depth 1 \
            https://github.com/dsx-ai-factory/nv-config-manager.git ../nv-config-manager

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # NetBox from PyPI rather than a source build: it is the whole reason this
      # job is cheap enough to run per-PR. Keep the pin in step with
      # build/versions.env's NETBOX_VERSION.
      - name: Install NetBox, plugin and provider
        run: |
          pip install 'netbox==4.7.0'
          pip install -e _plugin  # pulls netbox-bgp>=0.20.0 from PyPI
          pip install ../nv-config-manager/packages/dcim
          pip install -e '.[installer]'
          pip install pytest pytest-asyncio

      - name: Stand up NetBox with the air_trial topology
        run: |
          scripts/live-netbox.sh "${RUNNER_TEMP}/netbox" \
            ../nv-config-manager/development/mock_topology/context/air_trial

      - name: Live suite
        env:
          NVCM_LIVE_SERVER: http://localhost:8000
          NVCM_LIVE_TOKEN: nbt_liveCItoken1.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          # Where the `log` publisher writes envelopes; the mutation tests read
          # them back from here instead of standing up a NATS broker.
          NVCM_LIVE_EVENT_LOG: ${{ runner.temp }}/netbox/events.log
        run: pytest tests/live -v

      - name: Logs on failure
        if: failure()
        run: |
          tail -100 "${RUNNER_TEMP}/netbox/netbox.log" || true
          tail -50 "${RUNNER_TEMP}/netbox/events.log" || true
