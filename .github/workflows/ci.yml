name: CI

on:
  pull_request: {}
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      # Both halves of `make lint`, so formatting drift cannot land on main and
      # then surface as an unrelated diff in someone else's PR.
      - name: Ruff
        run: uvx ruff@0.15.11 check src/ tests/
      - name: Ruff format
        run: uvx ruff@0.15.11 format --check src/ tests/

  # NETBOX_VERSION is what `make version-check` compares against the plugin's
  # min_version, so it drifting from NETBOX_REF makes that check assert the wrong
  # thing. Only upstream knows what the ref reports.
  netbox-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pinned ref reports the version we record
        run: |
          set -euo pipefail
          . build/versions.env
          url="https://raw.githubusercontent.com/netbox-community/netbox/${NETBOX_REF}/netbox/release.yaml"
          release=$(curl -fsSL "$url")
          echo "$release"
          # `version` alone, not the designation: PluginConfig.validate() is
          # handed RELEASE.version, so a beta's "4.7.0" is what gates the plugin.
          actual=$(printf '%s\n' "$release" | sed -n 's/^version: *"\(.*\)"/\1/p')
          if [ "$actual" != "${NETBOX_VERSION}" ]; then
            echo "::error::NETBOX_REF ${NETBOX_REF} reports NetBox ${actual}," \
                 "but build/versions.env records NETBOX_VERSION=${NETBOX_VERSION}."
            exit 1
          fi

  # NVCM installs the provider by copying /plugin-wheels out of this image and
  # running `pip install --no-index --find-links` in an init container. Nothing
  # on that path fails loudly, so assert the contract here.
  provider-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch DCIM SDK
        run: |
          git clone --depth 1 --branch zb/pluggable-dcim \
            https://github.com/NVIDIA/nv-config-manager.git ../nv-config-manager
      - name: Build
        run: |
          docker build --platform linux/amd64 \
            --build-context sdk=../nv-config-manager/components/dcim \
            -t nv-config-manager-dcim-netbox:ci .
      - name: Offline /plugin-wheels contract
        run: build/check-provider-image.sh nv-config-manager-dcim-netbox:ci linux/amd64

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      # The SDK is not yet published. Until then, install it from the NVCM
      # branch that defines the provider contract. Update this once published.
      - name: Fetch DCIM SDK
        run: |
          git clone --depth 1 --branch zb/pluggable-dcim \
            https://github.com/NVIDIA/nv-config-manager.git ../nv-config-manager
      # Into a venv, not `--system`: the interpreter setup-uv provisions is
      # uv-managed and externally managed, so `uv pip install --system` errors.
      # `--clear` because setup-uv already creates (and exports) a .venv itself;
      # without it `uv venv` aborts on the existing directory.
      - name: Install
        run: |
          uv venv --clear --python 3.13
          uv pip install ../nv-config-manager/components/dcim
          # The `installer` extra (click + PyYAML) is needed to *collect* the suite:
          # test_installer.py and test_air.py import both at module scope. The `air`
          # extra is not installed; those imports are guarded with importorskip.
          uv pip install -e '.[installer]'
          uv pip install pytest pytest-asyncio
      - name: Tests
        run: .venv/bin/pytest

  # The provider against a real NetBox, which is the only place upstream schema
  # drift shows up: the fixture suites cannot see a renamed GraphQL field or a
  # changed custom-field shape. The 4.7 upgrade produced two such breaks.
  #
  # Needs the plugin, which lives in a private sibling repo, so this job is
  # skipped unless PLUGIN_REPO_TOKEN is set (a token with read access to
  # netboxlabs/netbox_nv_config_manager). GITHUB_TOKEN is scoped to this repo and
  # cannot check it out.
  live-netbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
          POSTGRES_DB: netbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Check for the plugin-repo token
        id: gate
        run: |
          if [ -n "${{ secrets.PLUGIN_REPO_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PLUGIN_REPO_TOKEN not set; skipping the live NetBox suite."
          fi

      - name: Checkout plugin
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: netboxlabs/netbox_nv_config_manager
          token: ${{ secrets.PLUGIN_REPO_TOKEN }}
          # actions/checkout refuses a path outside the workspace.
          path: _plugin

      # SDK and the topology blueprint both come from here.
      - name: Fetch NVCM
        if: steps.gate.outputs.enabled == 'true'
        run: |
          git clone --depth 1 --branch zb/pluggable-dcim \
            https://github.com/NVIDIA/nv-config-manager.git ../nv-config-manager

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: '3.13'

      # NetBox from PyPI rather than a source build: it is the whole reason this
      # job is cheap enough to run per-PR. Keep the pin in step with
      # build/versions.env's NETBOX_VERSION.
      - name: Install NetBox, plugin and provider
        if: steps.gate.outputs.enabled == 'true'
        run: |
          pip install 'netbox==4.7.0b1'
          pip install "https://github.com/netbox-community/netbox-bgp/archive/refs/heads/0.20.0.tar.gz"
          pip install -e _plugin
          pip install ../nv-config-manager/components/dcim
          pip install -e '.[installer]'
          pip install pytest pytest-asyncio

      - name: Stand up NetBox with the air_trial topology
        if: steps.gate.outputs.enabled == 'true'
        run: |
          scripts/live-netbox.sh "${RUNNER_TEMP}/netbox" \
            ../nv-config-manager/development/mock_topology/context/air_trial

      - name: Live suite
        if: steps.gate.outputs.enabled == 'true'
        env:
          NVCM_LIVE_SERVER: http://localhost:8000
          NVCM_LIVE_TOKEN: nbt_liveCItoken1.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: pytest tests/live -v

      - name: NetBox log
        if: failure() && steps.gate.outputs.enabled == 'true'
        run: tail -100 "${RUNNER_TEMP}/netbox/netbox.log" || true
