# DSX Air simulation with NetBox as the DCIM provider.
#
#   cp deploy/configs/air-trial.yaml air-trial.yaml
#   $EDITOR air-trial.yaml          # ngc_api_key, or export NGC_API_KEY
#   nv-config-manager-installer air-sim deploy -c air-trial.yaml
#
# Copy it rather than editing in place: the working copy takes an NGC key and can
# take a NetBox token, and the repo ignores /air-trial.yaml for that reason.
#
# This is NVCM's own air-sim format. `dcim_provider: netbox` selects this
# package's AIR hooks; everything NetBox-specific lives under `dcim_settings`
# and is validated by NetBoxAirSettings.

# 7 devices. `air_superpod` is 24 and needs a much larger box.
mock_blueprint: air_trial

deployment_name: demo
simulation_name: nv-config-manager-netbox-air-trial

size: small

dcim_provider: netbox

# Also read from $NGC_API_KEY, which is the better place for it.
ngc_api_key: ''

# --- optional, shown at their defaults ---------------------------------------
#
# dcim_settings:
#   # Images built for linux/amd64 by the hooks before the sim is allocated.
#   # Neither exists in a registry, so both are shipped into the sim's kind
#   # cluster over SSH. Tags track the package version.
#   image_repository: nv-config-manager-netbox
#   image_tag: '0.1.0'
#   provider_image: nv-config-manager-dcim-netbox:0.1.0
#   # NetBox v2 token; generated when empty, then installed into NetBox.
#   token: ''
#   # The sim is a disposable demo, so the UI login is predictable.
#   superuser_name: demo
#   superuser_password: demo
#   # Load the sim's topology into NetBox with the plugin's nvcm_load_dcim. Off
#   # leaves an empty NetBox, which renders nothing.
#   load_blueprint: true
#   # Extra `--set` arguments for the NetBox chart.
#   helm_set: []
