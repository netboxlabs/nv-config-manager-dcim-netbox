# NVIDIA Config Manager installer profile: NetBox as the DCIM provider.
#
# This is a valid nv-config-manager-install.yaml on its own -- it is NOT a
# template. `nvcm-netbox up` loads it and overrides only the values it has to
# compute (API token, image tags, cluster size, namespace); everything else is
# yours to edit.
#
# The one thing the NVCM installer TUI cannot express is `dcim.provider_packages`
# (there is no widget for it), and without that block the `netbox` entry point is
# never installed and provider discovery fails. That is the main reason this file
# exists. You can still open the generated result in the TUI to tune the rest:
#
#   nvcm-netbox config -o my.yaml
#   uv run --project ../nv-config-manager/installer \
#     nv-config-manager-installer init -c my.yaml
#
# Use with: nvcm-netbox up --nvcm-repo ../nv-config-manager

version: "1"

cluster:
  hostname: config-manager.local
  environment: local
  namespace: nv-config-manager
  release_name: nv-config-manager
  airgapped: false
  mock_devices: true
  # small = single-replica dev profile (8 vCPU / 24GB). medium and large raise
  # replica counts and resource requests; override with `nvcm-netbox up --size`.
  size: small

secrets:
  method: kubernetes
  config_manager_service_username: nv-config-manager
  k8s:
    dcim:
      values:
        # Generated by `nvcm-netbox up` and installed into NetBox by the plugin's
        # nvcm_init, so both sides share one value and neither has to read it
        # back. Must be a v2 token: nbt_<12 chars>.<40 chars>.
        token: REPLACED_BY_INSTALLER

network_secrets:
  - name: Hash Salt
    description: Password hashing salt for user accounts
    source: generate
    secret_key: hash_salt
    rotation: r1
    required: true
  - name: BGP Password
    description: BGP peering authentication
    source: generate
    secret_key: bgp_password
    rotation: r1
    required: true
  - name: Device Admin Password
    description: Admin/root password for managed devices
    source: generate
    secret_key: root_password
    rotation: r1
    required: true
  - name: NVIDIA Config Manager API Key
    description: NVIDIA Config Manager service account device credential
    source: generate
    secret_key: api_user_key
    rotation: r1
    required: true

sites:
  # Matches the default air_trial blueprint and its deployment-name fallback.
  - name: TRIAL01 - air_trial

sso:
  enabled: false

spiffe:
  enabled: false

# External DCIM provider.
dcim:
  provider: netbox
  # In-cluster Service created by deploy/netbox (fullnameOverride: netbox), in
  # the same namespace as NVCM. No host networking, no port-forward.
  server: http://netbox
  # Browser-facing route published by the provider installer.
  public_url: https://netbox.config-manager.local
  display_name: NetBox
  # Provisions the JetStream stream and sets [nats] dcim_change_stream /
  # dcim_change_subject. `subject` must equal the NetBox plugin's nats_subject
  # (deploy/netbox/values.yaml: nvcm.eventSubject) or events go nowhere.
  event_stream: netbox
  event_subject: netbox.change
  provider_packages:
    - name: netbox
      # Offline wheelhouse built by `make image`; installed into the NVCM
      # workloads by an init container. Tag is replaced by `nvcm-netbox up`.
      image: nv-config-manager-dcim-netbox:0.1.0

content:
  jobs: []
  template_plugins:
    - path: development/air_sim/template_plugins/superpod-template-plugin

services:
  render: true
  ztp: true
  dhcp: true
  temporal: true
  config_store: true
  # NetBox is the DCIM provider, so NVCM's bundled one is not deployed.
  nautobot: false

infrastructure:
  gateway: envoyGateway
  tls: true
  cnpg_s3_backup:
    enabled: false
  monitoring:
    enabled: false
  load_balancer:
    provider: ""
