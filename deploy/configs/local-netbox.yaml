# NVIDIA Config Manager installer profile: NetBox as the DCIM provider.
#
# A complete nv-config-manager-install.yaml for a local kind cluster. The
# `netbox` installer provider (this package's `installer` extra) deploys NetBox
# from deploy/netbox before NVCM's own Helm release and bootstraps it with the
# API token the installer generates, so nothing here has to be filled in first.
#
#   nv-config-manager-installer validate deploy/configs/local-netbox.yaml
#   nv-config-manager-installer deploy deploy/configs/local-netbox.yaml \
#     --project-root ../nv-config-manager --image-source local --build-images \
#     --load-kind --install-envoy-gateway --install-cnpg-operator --install-cert-manager
#
# `make kind-up` runs exactly that. Edit a copy with
# `nv-config-manager-installer init -c my.yaml` to tune the rest.

version: "1"

cluster:
  hostname: config-manager.local
  environment: local
  namespace: nv-config-manager
  release_name: nv-config-manager
  airgapped: false
  mock_devices: true
  # small = single-replica dev profile (8 vCPU / 24GB). medium and large raise
  # replica counts and resource requests.
  size: small

secrets:
  method: kubernetes
  config_manager_service_username: nv-config-manager
  # The DCIM token is generated by the installer as a NetBox v2 token and stored
  # in the dcim-token Secret; the plugin's nvcm_init installs the same value into
  # NetBox. Set secrets.k8s.dcim.values.token to supply one instead.

network_secrets:
  - name: Hash Salt
    description: Password hashing salt for user accounts
    source: generate
    secret_key: hash_salt
    rotation: r1
    required: true
  - name: BGP Password
    description: BGP peering authentication
    source: generate
    secret_key: bgp_password
    rotation: r1
    required: true
  - name: Device Admin Password
    description: Admin/root password for managed devices
    source: generate
    secret_key: root_password
    rotation: r1
    required: true
  - name: NVIDIA Config Manager API Key
    description: NVIDIA Config Manager service account device credential
    source: generate
    secret_key: api_user_key
    rotation: r1
    required: true

sites:
  # Matches the default air_trial blueprint and its deployment-name fallback.
  - name: TRIAL01 - air_trial

sso:
  enabled: false

spiffe:
  enabled: false

dcim:
  provider: netbox
  # Deploy NetBox into the cluster from deploy/netbox. `false` points NVCM at
  # an existing NetBox through `server` instead.
  local: true
  # Browser-facing route published through NVCM's Gateway.
  public_url: https://netbox.config-manager.local
  # Provider settings; see NetBoxInstallerSettings for the full list. Defaults
  # follow the package version (image_tag), deploy/netbox (chart, release) and
  # the chart's publisher values (event_stream, event_subject).
  settings:
    superuser_name: admin
  provider_packages:
    - name: netbox
      # Offline wheelhouse built by `make image`; installed into the NVCM
      # workloads by an init container. The tag tracks the package version.
      image: nv-config-manager-dcim-netbox:0.1.0

content:
  template_plugins:
    - path: development/air_sim/template_plugins/superpod-template-plugin

services:
  render: true
  ztp: true
  dhcp: true
  temporal: true
  config_store: true

infrastructure:
  gateway: envoyGateway
  tls: true
  cnpg_s3_backup:
    enabled: false
  monitoring:
    enabled: false
  load_balancer:
    provider: ""
