# NetBox as NVCM's DCIM provider.
#
# Normally driven by the `netbox` installer provider inside
# `nv-config-manager-installer deploy`, which fills in the generated values (API
# token, NATS password, stream, hostnames). It is a plain chart, so `helm
# install` works too; see docs/deployment.md for the manual sequence.

# --- our settings ------------------------------------------------------------
nvcm:
  # NVCM's in-cluster NATS. Deploy NetBox into the same namespace as NVCM so this
  # resolves without cross-namespace DNS; override natsService if the NVCM release
  # is named something other than `nv-config-manager`.
  natsService: nv-config-manager-nats
  natsUser: nv-config-manager

  # NATS password, shared with NVCM's `nats-nv-config-manager` secret. While it is
  # empty the publisher stays in `log` mode rather than failing, which is what
  # lets NetBox be installed standalone.
  #
  # The installer provider sets it on the FIRST install, from the same secret
  # state NVCM's own NATS Secrets are created from, so the release never has to
  # be upgraded just to switch the publisher on. The cost is that NetBox is
  # pointed at nv-config-manager-nats
  # before that Service exists; the publisher connects synchronously when it
  # publishes, so a UI/API write during the NVCM deploy blocks on connection
  # retries before it logs. `nvcm_init` and the topology load both suppress
  # events, so the documented bring-up never hits it.
  #
  # Set it yourself if you are driving helm directly.
  natsPassword: ""

  # Must equal NVCM's `[nats] dcim_change_subject`, which the NVCM chart renders
  # from `dcim.events.subject`. If these disagree, changes publish but nothing
  # consumes them.
  eventSubject: netbox.change

  # Must equal NVCM's `[nats] dcim_change_stream` (`dcim.events.stream`). The
  # plugin publishes into it with JetStream, so each event is acked as stored
  # rather than fired into the dark, and the stream is checked at connect -- a
  # name that disagrees with NVCM's fails loudly instead of losing every event.
  # `nvcm-netbox verify` compares the two.
  eventStream: netbox

  # Base URL of NVCM's workflow UI, e.g. https://config-manager.local. The
  # Deploy and See Diff controls link to prefilled workflow forms under
  # `<workflowUrl>/workflows/<name>/form`; while it is empty they render as
  # plain status text rather than links to nowhere, which is what lets NetBox
  # be installed standalone.
  #
  # The installer provider derives it from the install config's cluster
  # hostname, the same value NVCM's own chart renders its gateway routes from.
  # Set it yourself if you are driving helm directly.
  workflowUrl: ""

  # Browser and API routes are rendered by NVCM's own chart from the
  # `dcim.local.*` values the installer provider emits (templates/httproutes.yaml
  # there), so this chart publishes no HTTPRoute of its own.

  # PostgreSQL for NetBox. One of three sources, in this order:
  #   cnpg.enabled: true   -> templates/cnpg-cluster.yaml renders a CNPG Cluster
  #                           (operator required; NVCM's deploy installs it in
  #                           its install-crds step, before NetBox).
  #   external.host set    -> a user-managed PostgreSQL; set cnpg.enabled false.
  #   neither              -> set netbox.postgresql.enabled true for the upstream
  #                           chart's bundled PostgreSQL (standalone use).
  # In every case NetBox reads its credentials from the `cluster-dcim-app`
  # Secret (keys `username`, `password`), which NVCM's installer creates from the
  # provider's `databases=("dcim",)` contribution and `nvcm-netbox netbox up`
  # seeds the same way. CNPG also bootstraps the database owner from it.
  database:
    name: dcim
    user: dcim
    credentialsSecret: cluster-dcim-app
    cnpg:
      enabled: true
      clusterName: cluster-dcim
      instances: 1
      enablePDB: false
      # Empty uses the operator's default PostgreSQL image.
      imageName: ""
      postgresql:
        maxConnections: "200"
        sharedBuffers: "256MB"
      storage:
        size: 10Gi
        storageClass: ""
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
      # Propagated onto the instance pods (NVCM's global.customLabels).
      inheritedLabels: {}
      # Mirrors NVCM's cnpg.backup.* / cnpg.<cluster>.backup.*; the installer
      # provider fills it from infrastructure.cnpg_s3_backup so NetBox's
      # database is backed up on the same schedule to the same bucket.
      backup:
        enabled: false
        schedule: "0 0 0 * * *"
        retentionPolicy: "30d"
        destinationType: s3
        s3:
          endpoint: ""
          bucket: ""
          path: ""
        credentialsSecret: cnpg-backup-credentials
        walCompression: gzip
        dataCompression: gzip
    external:
      host: ""
      port: 5432

  # Prometheus scraping. templates/servicemonitor.yaml renders a ServiceMonitor
  # for NetBox's /metrics when this is on and the monitoring.coreos.com API is
  # registered; it also needs netbox.metrics.enabled (set below by the provider).
  # NVCM's Alloy/Prometheus watch ServiceMonitors in the release namespace, so
  # no selector label is required; `labels` is for a site-level Prometheus that
  # filters on one.
  monitoring:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

# --- upstream netbox chart ---------------------------------------------------
netbox:
  # Fixes the Service name to `netbox` rather than `<release>-netbox`, so the
  # NVCM installer config can hardcode `dcim.server: http://netbox` regardless of
  # what the release is called.
  fullnameOverride: netbox

  image:
    # Built by `make netbox-image`: netbox-docker's published NetBox 4.7 image
    # (pinned in build/versions.env) plus the NV Config Manager plugin and
    # netbox-bgp. Not itself published, so it is side-loaded into the cluster.
    registry: ""
    repository: nv-config-manager-netbox
    tag: "0.1.0"
    pullPolicy: IfNotPresent

  # The upstream chart's `resourcesPreset: medium` caps memory at 1536Mi, which
  # nvcm_load_dcim exceeds: a topology import is far heavier than serving, and
  # being OOMKilled mid-import takes the serving pod down with it.
  #
  # Only the limit is raised. Requests drive scheduling, so the idle footprint
  # is unchanged and the headroom is used only during an import.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 750m
      memory: 3Gi

  plugins:
    - netbox_nv_config_manager
    # Supplies the BGP session/peering data the fabric render path reads; the
    # plugin warns at startup if it is installed but not enabled.
    - netbox_bgp

  # PLUGINS_CONFIG is deliberately NOT set here. It carries the NATS password, so
  # it is delivered through a Secret via extraConfig below rather than through
  # values (which land in a ConfigMap).
  pluginsConfig: {}

  extraConfig:
    - secret:
        # templates/publisher-config-secret.yaml
        secretName: nvcm-netbox-publisher
        optional: false

  # Require a login for the UI and API. The upstream chart defaults this to false
  # (unauthenticated read-only access), which NetBox 4.7 warns about at startup and
  # NetBox 5.0 removes outright -- unauthenticated access stops being supported, so
  # true is the setting this deployment ends up on either way.
  #
  # It does NOT silence the deprecation warning, and flipping it back will not
  # either: NetBox warns both ways, and the chart renders LOGIN_REQUIRED
  # unconditionally (templates/configmap.yaml, unlike MAINTENANCE_MODE two lines
  # below it), so `hasattr(configuration, 'LOGIN_REQUIRED')` is always true.
  #
  #     if not LOGIN_REQUIRED:  warn("Unauthenticated access ... no longer supported")
  #     elif hasattr(...):      warn("This parameter can be removed ...")
  #
  # We take the second, benign warning. Removing it needs an upstream chart change.
  #
  # Safe for everything this deployment does: NVCM authenticates with the API
  # token, and the readiness and startup probes hit /login/, which stays public.
  loginRequired: true

  superuser:
    name: admin
    email: admin@example.com
    # A v2 token, `nbt_<12-char key>.<40-char secret>`. NVCM authenticates to
    # NetBox with this exact value, and the plugin's nvcm_init installs it from
    # SUPERUSER_API_TOKEN -- so it is generated once and shared, never read back.
    # Left empty the chart substitutes a uuid4, which is NOT a valid v2 token.
    apiToken: ""
    password: ""

  # API_TOKEN_PEPPERS is required for v2 tokens. Left empty the chart generates
  # one and preserves it across upgrades, which is what we want -- rotating it
  # invalidates the token NVCM holds.
  apiTokenPeppers: {}

  # SSO through NVCM's gateway. The installer provider turns this on when
  # `sso.enabled` and fills the group lists from `dcim.settings.sso`; see
  # docs/deployment.md. NetBox trusts the X-Auth-Request-* headers because
  # NVCM's gateway strips client-supplied copies on every route and the OIDC
  # proxy / JWT policy set them from the verified identity.
  remoteAuth:
    enabled: false

  # Prometheus /metrics. Turned on by the installer provider with monitoring;
  # the ServiceMonitor is this chart's (templates/servicemonitor.yaml), not the
  # upstream one, so it can be gated on the CRD being present.
  metrics:
    enabled: false
    serviceMonitor:
      enabled: false

  # Database connection. The host is the CNPG read-write Service by default;
  # the provider replaces it with nvcm.database.external.host when an external
  # PostgreSQL is configured. Unused when netbox.postgresql.enabled is true.
  externalDatabase:
    host: cluster-dcim-rw
    port: 5432
    database: dcim
    username: dcim
    existingSecretName: cluster-dcim-app
    existingSecretKey: password

  # The upstream chart's bundled PostgreSQL, for standalone installs with no
  # CNPG operator: set this true and nvcm.database.cnpg.enabled false.
  # Credentials come from the netbox-datastores Secret rather than being
  # generated by the subchart, so they outlive `helm uninstall` and keep
  # matching the data on the PVCs. See templates/datastore-credentials.yaml.
  postgresql:
    enabled: false
    auth:
      existingSecret: netbox-datastores
    # The upstream nano preset (192Mi limit) is OOM-killed when concurrent
    # renders query and persist lifecycle state through NetBox.
    primary:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
  valkey:
    enabled: true
    auth:
      existingSecret: netbox-datastores
      existingSecretPasswordKey: valkey-password
