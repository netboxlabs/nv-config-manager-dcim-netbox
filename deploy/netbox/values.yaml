# NetBox as NVCM's DCIM provider.
#
# Normally driven by `nvcm-netbox up`, which fills in the generated values
# (API token, NATS password). It is a plain chart, so `helm install` works too --
# see docs/deployment.md for the manual sequence.

# --- our settings ------------------------------------------------------------
nvcm:
  # NVCM's in-cluster NATS. Deploy NetBox into the same namespace as NVCM so this
  # resolves without cross-namespace DNS; override natsService if the NVCM release
  # is named something other than `nv-config-manager`.
  natsService: nv-config-manager-nats
  natsUser: nv-config-manager

  # NATS password, shared with NVCM's `nats-nv-config-manager` secret. While it is
  # empty the publisher stays in `log` mode rather than failing, which is what
  # lets NetBox be installed standalone.
  #
  # `nvcm-netbox up` sets it on the FIRST install: it either reads an
  # already-deployed NATS secret or mints the value it will hand NVCM in the
  # install config, so the release never has to be upgraded just to switch the
  # publisher on. The cost is that NetBox is pointed at nv-config-manager-nats
  # before that Service exists; the publisher connects synchronously when it
  # publishes, so a UI/API write during the NVCM deploy blocks on connection
  # retries before it logs. `nvcm_init` and the topology load both suppress
  # events, so the documented bring-up never hits it.
  #
  # Set it yourself if you are driving helm directly.
  natsPassword: ""

  # Must equal NVCM's `[nats] dcim_change_subject`, which the NVCM chart renders
  # from `dcim.events.subject`. If these disagree, changes publish but nothing
  # consumes them.
  eventSubject: netbox.change

  # Browser access through NVCM's Gateway, so NetBox is reachable the same way
  # NVCM's own services are rather than only through `kubectl port-forward`.
  # See templates/httproute.yaml.
  gateway:
    enabled: true
    # NVCM's Gateway. `<release>-gateway`, and the NVCM release is normally
    # `nv-config-manager`. Deployed into the same namespace unless overridden.
    name: nv-config-manager-gateway
    namespace: ""
    # NVCM's `cluster.hostname`. Its TLS certificate is issued for this name and
    # `*.<name>`, so any prefix below is already covered.
    baseHostname: config-manager.local
    # Defaults to netbox.<baseHostname>.
    hostname: ""

# --- upstream netbox chart ---------------------------------------------------
netbox:
  # Fixes the Service name to `netbox` rather than `<release>-netbox`, so the
  # NVCM installer config can hardcode `dcim.server: http://netbox` regardless of
  # what the release is called.
  fullnameOverride: netbox

  image:
    # Built by `make netbox-image`: NetBox at a pinned `feature` commit plus the
    # NV Config Manager plugin and netbox-bgp. Not a published image -- 4.7 is
    # unreleased and the plugin needs its GraphQL type extensions.
    registry: ""
    repository: nv-config-manager-netbox
    tag: "0.1.0"
    pullPolicy: IfNotPresent

  # The upstream chart's `resourcesPreset: medium` caps memory at 1536Mi, which
  # nvcm_load_dcim exceeds: a topology import is far heavier than serving, and
  # being OOMKilled mid-import takes the serving pod down with it.
  #
  # Only the limit is raised. Requests drive scheduling, so the idle footprint
  # is unchanged and the headroom is used only during an import.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 750m
      memory: 3Gi

  plugins:
    - netbox_nv_config_manager
    # Supplies the BGP session/peering data the fabric render path reads; the
    # plugin warns at startup if it is installed but not enabled.
    - netbox_bgp

  # PLUGINS_CONFIG is deliberately NOT set here. It carries the NATS password, so
  # it is delivered through a Secret via extraConfig below rather than through
  # values (which land in a ConfigMap).
  pluginsConfig: {}

  extraConfig:
    - secret:
        # templates/publisher-config-secret.yaml
        secretName: nvcm-netbox-publisher
        optional: false

  superuser:
    name: admin
    email: admin@example.com
    # A v2 token, `nbt_<12-char key>.<40-char secret>`. NVCM authenticates to
    # NetBox with this exact value, and the plugin's nvcm_init installs it from
    # SUPERUSER_API_TOKEN -- so it is generated once and shared, never read back.
    # Left empty the chart substitutes a uuid4, which is NOT a valid v2 token.
    apiToken: ""
    password: ""

  # API_TOKEN_PEPPERS is required for v2 tokens. Left empty the chart generates
  # one and preserves it across upgrades, which is what we want -- rotating it
  # invalidates the token NVCM holds.
  apiTokenPeppers: {}

  # Bundled datastores. Keeps NetBox independent of NVCM's CNPG/Redis so it can
  # be deployed first, and keeps this chart free of assumptions about NVCM's
  # secret and service naming.
  # Credentials come from the netbox-datastores Secret rather than being
  # generated by the subcharts, so they outlive `helm uninstall` and keep
  # matching the data on the PVCs. See templates/datastore-credentials.yaml.
  postgresql:
    enabled: true
    auth:
      existingSecret: netbox-datastores
  valkey:
    enabled: true
    auth:
      existingSecret: netbox-datastores
      existingSecretPasswordKey: valkey-password
