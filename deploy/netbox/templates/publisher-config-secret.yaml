{{- /*
PLUGINS_CONFIG for the NetBox -> NVCM change-event publisher.

Delivered as a Secret (loaded through the netbox chart's `extraConfig`) rather
than through `pluginsConfig` values, because it carries the NATS password and
chart values are rendered into a ConfigMap.

With no NATS password set the publisher stays on the `log` backend instead of
failing, so the chart is installable standalone. `nvcm-netbox up` supplies the
password on the first install -- adopted from a deployed NATS, or minted here and
handed to NVCM in its install config -- so the release does not have to be
upgraded a second time to switch the publisher on. NetBox is still installed
before NVCM either way: it owns the API token NVCM authenticates with.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: nvcm-netbox-publisher
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nvcm-netbox
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: publisher-config
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  # Loaded by NetBox as additional configuration; the key must end in .yaml.
  nvcm-publisher.yaml: |
    PLUGINS_CONFIG:
      netbox_nv_config_manager:
    {{- if .Values.nvcm.natsPassword }}
        event_publisher: nats
        nats_url: nats://{{ .Values.nvcm.natsService }}:4222
        nats_subject: {{ .Values.nvcm.eventSubject | quote }}
        nats_user: {{ .Values.nvcm.natsUser | quote }}
        nats_password: {{ .Values.nvcm.natsPassword | quote }}
        # NVCM's bundled NATS runs password auth without TLS; setting nats_tls
        # here makes the client hang on the handshake.
    {{- else }}
        # No NATS password yet -- NVCM has not been deployed, or this chart was
        # installed standalone. Envelopes go to the
        # `netbox_nv_config_manager.events` logger. Re-run with
        # nvcm.natsPassword set to switch to the real bus.
        event_publisher: log
    {{- end }}
