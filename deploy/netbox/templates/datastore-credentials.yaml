{{- /*
Postgres and Valkey passwords, generated on first install.

The subcharts can generate their own, but their Secret is owned by the release
while their data lives on StatefulSet PVCs, which `helm uninstall` leaves
behind. Reinstalling then mints passwords that cannot match the databases
already initialised on those volumes, and NetBox crashloops on "password
authentication failed for user netbox".

So this Secret is tied to the volumes' lifetime instead of the release's:
`resource-policy: keep` survives uninstall, and the lookup reuses whatever is
already there. Delete it only when you delete the PVCs.
*/ -}}
{{- $name := "netbox-datastores" -}}
{{- $current := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: nvcm-netbox
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: datastore-credentials
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
data:
  {{- range $key := list "postgres-password" "password" "replication-password" "valkey-password" }}
  {{ $key }}: {{ index $current $key | default (randAlphaNum 32 | b64enc) }}
  {{- end }}
